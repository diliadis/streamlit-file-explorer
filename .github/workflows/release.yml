name: Publish package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Package index (run this workflow from a version tag)
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}-${{ inputs.repository || 'pypi' }}
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.repository || 'pypi' }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/project/streamlit-file-explorer/' || 'https://pypi.org/project/streamlit-file-explorer/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-ubuntu-latest-3.12
          path: dist/
      - name: Publish the tested artifacts with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/
          attestations: true
